<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuantAI Bot - Pro Terminal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono&family=Space+Grotesk:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="layout">
        <!-- LEFT NAV -->
        <nav class="left-nav">
            <div class="logo-container">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2L2 7V17L12 22L22 17V7L12 2Z" stroke="var(--accent-primary)" stroke-width="2" stroke-linejoin="round"/>
                    <circle cx="12" cy="12" r="3" fill="var(--accent-primary)"/>
                </svg>
            </div>
            <div class="nav-icons">
                <button class="nav-btn active" title="Chart">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M18 9l-5 5-4-4-4 4"/></svg>
                </button>
                <button class="nav-btn" title="Portfolio">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
                </button>
                <button class="nav-btn" title="Signals">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
                </button>
                <button class="nav-btn" title="History">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                </button>
            </div>
            <div class="nav-bottom">
                <button class="nav-btn" title="Settings">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                </button>
            </div>
        </nav>

        <!-- CHART AREA -->
        <main class="chart-area">
            <div class="toolbar">
                <button class="asset-selector" id="assetSelectorBtn">
                    <img src="https://assets.coingecko.com/coins/images/1/small/bitcoin.png" alt="BTC" width="16" height="16" id="assetIcon">
                    <span class="ticker" id="currentTicker">BTC/USD</span>
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
                </button>

                <div class="timeframes" id="timeframes">
                    <div class="tf-pill">1m</div>
                    <div class="tf-pill">5m</div>
                    <div class="tf-pill">15m</div>
                    <div class="tf-pill">1h</div>
                    <div class="tf-pill active">4h</div>
                    <div class="tf-pill">D</div>
                    <div class="tf-pill">W</div>
                    <div class="tf-indicator"></div>
                </div>

                <div class="toolbar-right">
                    <div class="live-pnl" id="livePnl">
                        <span class="dir-arrow">▲</span>
                        <div class="pnl-slot-wrapper">
                            <span class="pnl-value">+$0.00</span>
                        </div>
                        <span class="pnl-label">today</span>
                    </div>
                    <div class="connection-status">
                        <div class="dot live" id="connDot"></div>
                    </div>
                </div>
            </div>

            <div class="tv-embed-container" id="tv_chart_container"></div>

            <div class="signal-feed-bar" id="bottomSignalFeed">
                <div class="feed-content">
                    <span class="feed-icon">⚡</span>
                    <span class="feed-text">AI Signal Engine initialized. Waiting for market alpha...</span>
                </div>
            </div>
        </main>

        <!-- RIGHT PANEL -->
        <aside class="right-panel" id="rightPanel">
            <div class="panel-header">
                <h2>Portfolio</h2>
                <div class="portfolio-value">
                    <span class="mono" id="walletBalance">$10,000.00</span>
                    <button class="reset-wallet-btn" id="resetWalletBtn" title="Reset Wallet">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                    </button>
                </div>
            </div>

            <!-- AI Engine -->
            <section class="ai-engine section-collapsible" id="aiEngineSection">
                <div class="section-header" onclick="toggleSection('aiEngineSection')">
                    <h3>AI Engine</h3>
                    <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 15l-6-6-6 6"/></svg>
                </div>
                <div class="section-content">
                    <div class="status-row" title="Models trained on:\n- cantaro86/Financial-Models-Numerical-Methods\n- stefan-jansen/machine-learning-for-trading\n- LechGrzelak/Computational-Finance-Course\n- wilsonfreitas/awesome-quant\n- Shubhamsaboo/awesome-llm-apps">
                        <span class="model-name">Model: v2.4 | 5 Sources <svg style="display:inline; margin-left:4px; opacity:0.6" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg></span>
                        <span class="badge badge-active">Active</span>
                    </div>
                    
                    <div class="confidence-container">
                        <div class="confidence-header">
                            <span>Confidence</span>
                            <span class="mono" id="confidenceValue">0%</span>
                        </div>
                        <div class="confidence-meter" id="confidenceMeter">
                            <div class="block"></div>
                            <div class="block"></div>
                            <div class="block"></div>
                            <div class="block"></div>
                            <div class="block"></div>
                        </div>
                    </div>

                    <div class="stat-pills">
                        <div class="stat-pill">
                            <span class="label">Accuracy</span>
                            <span class="value mono">94.2%</span>
                        </div>
                        <div class="stat-pill">
                            <span class="label">Signals</span>
                            <span class="value mono" id="signalsToday">0</span>
                        </div>
                        <div class="stat-pill">
                            <span class="label">Win Rate</span>
                            <span class="value mono">68%</span>
                        </div>
                    </div>

                    <button class="cta-primary" id="runAnalysisBtn">
                        <svg class="atom-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="3"/>
                            <ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(45 12 12)"/>
                            <ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(-45 12 12)"/>
                        </svg>
                        <span>Run Analysis</span>
                    </button>

                    <div class="action-buttons">
                        <button class="ghost-btn execute-buy" id="execBuyBtn">Execute BUY</button>
                        <button class="ghost-btn execute-sell" id="execSellBtn">Execute SELL</button>
                    </div>

                    <div class="auto-trade-wrapper">
                        <button class="auto-trade-btn" id="autoTradeBtn">
                            <div class="status-dot"></div>
                            <span id="autoTradeText">Start Auto Trade</span>
                        </button>
                        <div class="timer-text mono" id="autoTradeTimer">00:30</div>
                    </div>
                </div>
            </section>

            <!-- Positions -->
            <section class="positions">
                <div class="section-header">
                    <h3>Positions</h3>
                </div>
                <div class="table-container">
                    <table class="pos-table">
                        <thead>
                            <tr>
                                <th>ASSET</th>
                                <th>SIDE</th>
                                <th>ENTRY</th>
                                <th>SIZE</th>
                                <th>PNL</th>
                            </tr>
                        </thead>
                        <tbody id="positionsBody">
                            <!-- Injected via JS -->
                        </tbody>
                    </table>
                </div>
            </section>

            <!-- Signal Log -->
            <section class="signal-log-section">
                <div class="section-header">
                    <h3>Signal Log</h3>
                    <button class="pause-log" id="pauseLogBtn">⏸ Pause</button>
                </div>
                <div class="log-container" id="signalLog">
                    <!-- Logs go here -->
                </div>
            </section>
        </aside>
    </div>

    <!-- Asset Modal -->
    <div class="modal-overlay" id="assetModal">
        <div class="modal-content">
            <input type="text" class="search-input" id="assetSearch" placeholder="Search assets (Cmd+K)..." autocomplete="off">
            <div class="asset-list" id="assetList">
                <!-- Injected via JS -->
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script src="app.js"></script>
</body>
</html>
